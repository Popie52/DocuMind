version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: rag_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  bot: 
    build: 
      context: ./apps/bot
    container_name: rag-bot
    env_file:
      - .env
    depends_on:
      - api

volumes:
  postgres-data:  